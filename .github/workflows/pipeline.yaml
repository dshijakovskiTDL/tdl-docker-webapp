name: Pipeline Skeleton

on:
  push:
    branches:
      - main
  workflow_dispatch:
    
jobs:
  build-backend:
    name: Build Backend
    runs-on: self-hosted
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          docker_image: shijakovski/webapp-backend
          component_path: ./backend
        
  build-frontend:
    name: Build Frontend
    runs-on: self-hosted
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          docker_image: shijakovski/webapp-frontend
          component_path: ./frontend
    

  deploy-backend-dev:
    name: Deploy Backend Dev
    runs-on: self-hosted
    steps:
      - run: echo "Deploying Backend Dev..."
    needs: build-backend    

  deploy-frontend-dev:
    name: Deploy Frontend Dev
    runs-on: self-hosted
    steps:
      - run: echo "Deploying Frontend Dev..."
    needs: build-frontend

  test-backend-dev:
    name: Test Backend Dev
    runs-on: self-hosted
    steps:
      - run: echo "Running Tests on Backend Dev..."
    needs: deploy-backend-dev


  deploy-backend-stg:
    name: Deploy Backend Staging
    runs-on: self-hosted
    steps:
      - run: echo "Deploying Backend Staging..."
    needs: build-backend    

  deploy-frontend-stg:
    name: Deploy Frontend Staging
    runs-on: self-hosted
    steps:
      - run: echo "Deploying Frontend Staging..."
    needs: build-frontend    

  test-backend-stg:
    name: Test Backend Staging
    runs-on: self-hosted
    steps:
      - run: echo "Running Tests on Backend Staging..."
    needs: deploy-backend-stg


  deploy-backend-prod:
    name: Deploy Backend Production
    runs-on: self-hosted
    steps:
      - run: echo "Deploying Backend Production..."
    needs: build-backend    

  deploy-frontend-prod:
    name: Deploy Frontend Production
    runs-on: self-hosted
    steps:
      - run: echo "Deploying Frontend Production..."
    needs: build-frontend    

  test-backend-prod:
    name: Test Backend Production
    runs-on: self-hosted
    steps:
      - run: echo "Running Tests on Backend Production..."
    needs: deploy-backend-prod
